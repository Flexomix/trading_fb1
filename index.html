<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <style>

</head>

    <!-- Скрипт tgtrack -->

<body class="min-h-screen flex flex-col items-center text-white bg-gradient-to-b from-[#12161f] to-[#0a0d12]">

    <!-- Шапка (Header) - Адаптивная, растягивается на всю ширину экрана -->

            <span class="font-semibold text-lg">Telegram</span>
        </div>
        <!-- Кнопка Download (Ссылка) -->
        <a href="https://t.me/AlphaFGPT_Signals_bot" class="bg-[#2b9af3] hover:bg-blue-600 text-white font-semibold py-1.5 px-5 rounded-xl text-sm transition-colors shadow-sm">
            DOWNLOAD

    <!-- Основной контент (Карточка канала) -->
    <div class="w-full max-w-md p-4 flex flex-col">

                <!-- Аватарка (Прежняя ссылка) -->
                <a href="https://t.me/AlphaFGPT_Signals_bot" target="_blank" rel="noopener noreferrer">
                      <img src="https://i.ibb.co/7tpdVRp9/avatar.jpg" alt="Channel Avatar" class="w-32 h-32 rounded-full mx-auto object-cover border-4 border-[#222834] shadow-md mb-4">
                </a>
                
                <div class="flex items-center justify-center gap-1.5 mb-1">
                    <h1 class="text-xl font-bold">AlphaGPT | Signals</h1>
                    
                    <!-- ГАЛОЧКА ТЕПЕРЬ КАРТИНКОЙ -->
                    <!-- Вставьте ссылку на вашу галочку в src="" -->
                    <img src="https://i.ibb.co/rrKvs9f/2026-10-07-0445253.png" alt="Verified" class="w-6 h-6 object-contain flex-shrink-0">
                    
                </div>
                <p class="text-gray-400 text-sm mb-3">@AlphaFGPT_Signals_bot</p>
                <p class="text-gray-400 text-sm mb-3">54 320 monthly users</p>

                <!-- Описание -->
                <p class="text-gray-300 text-sm leading-relaxed mb-5">
                    🤖 An AI bot that gives signals with 98% accuracy. 💸 Just copy its trades and earn $100+ per day automatically.
                </p>

                <!-- Кнопка "Подписаться" (Ссылка) -->
                <div class="flex justify-center">
                    <a href="https://t.me/AlphaFGPT_Signals_bot" class="bg-[#2b9af3] hover:bg-blue-600 text-white font-bold py-3 px-10 rounded-full shadow-md transition-colors">
                        START BOT
                    </a>
                </div>
            </div>
          

        </div>
    </div>

</body>
</html>
